<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
<link rel="icon" href="{{ '/assets/img/flor.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<div class="top"><div class="top-in">
  <a class="logo" href="{{ '/' | relative_url }}">penthos<span>_</span></a>
  <nav>
    <a href="{{ '/' | relative_url }}"{% if page.url == "/" or page.layout == "post" %} class="on"{% endif %}>entradas</a>
    <a href="{{ '/archivo/' | relative_url }}"{% if page.url == "/archivo/" %} class="on"{% endif %}>archivo</a>
    <a href="{{ '/sobre/' | relative_url }}"{% if page.url == "/sobre/" %} class="on"{% endif %}>sobre el autor</a>
  </nav>
</div></div>

<main>
{{ content }}
</main>

<footer class="site">
  <span>penthos · {{ site.author | downcase }}</span>
  <span>@ahrsml</span>
</footer>
</body>
</html>
