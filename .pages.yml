# Configuración de Pages CMS (app.pagescms.org)
media:
  input: assets/img
  output: /assets/img

content:
  - name: entradas
    label: Entradas
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, tipo, published, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: date
        label: Fecha
        type: date
        required: true
      - name: tipo
        label: Tipo
        type: select
        default: ensayo
        options:
          values: [ensayo, bitácora]
      - name: published
        label: Publicado (apagado = borrador)
        type: boolean
        default: true
      - name: body
        label: Texto
        type: rich-text
        options:
          format: markdown
          switcher: true

  - name: poesia
    label: Poesía
    type: collection
    path: poesia/_posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, published, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: date
        label: Fecha
        type: date
        required: true
      - name: tipo
        type: string
        hidden: true
        default: poesía
      - name: published
        label: Publicado (apagado = borrador)
        type: boolean
        default: true
      - name: body
        label: Poema
        type: code
        options:
          format: markdown
          lineWrapping: true

  - name: sobre
    label: Sobre el autor
    type: file
    path: sobre.md
    format: yaml-frontmatter
    fields:
      - name: layout
        type: string
        hidden: true
        default: sobre
      - name: title
        label: Título
        type: string
      - name: permalink
        type: string
        hidden: true
        default: /sobre/
      - name: body
        label: Bio
        type: rich-text
        options:
          format: markdown
          switcher: true

  - name: bibliografia
    label: Bibliografía
    type: file
    path: _data/bibliografia.yml
    format: yaml
    fields:
      - name: referencias
        label: Referencias (MLA)
        type: string
        list: true
